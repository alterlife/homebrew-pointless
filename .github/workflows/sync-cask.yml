name: Sync Cask

on:
  schedule:
    - cron: '0 * * * *'
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

concurrency:
  group: sync-cask
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Fetch latest release and update cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo alterlife/pointless --json tagName --jq '.tagName' || true)
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "No release found"
            exit 0
          fi

          TMP_DIR=$(mktemp -d)
          gh release download "$TAG" --repo alterlife/pointless --pattern "checksums.txt" --dir "$TMP_DIR"
          DMG_SHA=$(awk '$2 == "Pointless.dmg" {print $1}' "$TMP_DIR/checksums.txt")
          if [[ ! "$DMG_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid or missing Pointless.dmg sha256: '$DMG_SHA'" >&2
            exit 1
          fi

          ruby -e '
            version = ARGV[0]
            sha = ARGV[1]
            path = "Casks/pointless.rb"
            content = File.read(path)
            abort "Failed to update version in #{path}" unless content.sub!(/version\s+"[^"]+"/, %{version "#{version}"})
            abort "Failed to update sha256 in #{path}" unless content.sub!(/sha256\s+(?::no_check|"[^"]+")/, %{sha256 "#{sha}"})
            File.write(path, content)
          ' "$VERSION" "$DMG_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Casks/pointless.rb
          if ! git diff --staged --quiet; then
            git commit -m "chore(cask): update pointless to ${VERSION}"
            git push origin main
          else
            echo "Cask is already up to date ($VERSION)"
          fi
